repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: Mypy type check
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true