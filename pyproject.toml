[project]
name = "python-practise"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = [
    "1-Enviroment/tests",
    "2-Python-Syntax/tests",
]
pythonpath = [
    "1-Enviroment/src",
    "2-Python-Syntax",
]

[tool.ruff.lint.isort]
known-first-party = ["todo"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
extend-exclude = ["*.md"]

[tool.mypy]
files = [
    "1-Enviroment/src",
    "2-Python-Syntax/todo",
]
strict = true